  .pillrow { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .pill {

    color:#d7e1ff; font-size:13px; background:rgba(255,255,255,.02);
  }
  button {
    cursor:pointer; border:none; color:var(--text);
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .primary {
    margin-top:18px; padding:14px 22px; border-radius:16px;
    background:linear-gradient(135deg, #7ea7ff, #a7bbff); color:#fff; font-weight:800; font-size:16px;
  }
  .primary:hover { transform:translateY(-1px); filter:brightness(1.05); }
  .progress-card { padding:16px 18px; margin-bottom:16px; }
  .progress-top { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin-bottom:10px; }
  .bar { height:12px; border-radius:999px; background:#0f1522; border:1px solid #222c3d; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,#7ea7ff,#c8d6ff); transition:width .2s ease; }
  .question-card { padding:22px 20px 22px; }
  .section-tag {
    display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; margin-bottom:14px;
    border:1px solid var(--line);
  }
  .blue-tag { background:rgba(120,168,255,.12); color:#d6e5ff; }
  .red-tag { background:rgba(255,143,143,.12); color:#ffdada; }
  .gold-tag { background:rgba(244,207,122,.12); color:#ffe8ae; }
  .question-title { font-size:26px; line-height:1.55; margin:0 0 18px; }
  .likert-labels { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:8px; }
  .scale-grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:10px; }
  .scale-btn, .seat-btn, .story-btn {
    background:var(--btn); border:1px solid #334056; border-radius:16px;
    padding:16px 10px; font-size:16px;
  }
  .scale-btn:hover, .seat-btn:hover, .story-btn:hover { background:var(--btnHover); border-color:var(--accent); transform:translateY(-1px); }
  .seat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .story-grid { display:grid; gap:10px; }
  .result-card { padding:24px 22px; }
  .badge {
    display:inline-block; padding:6px 10px; border-radius:999px;
    background:rgba(152,179,255,.12); border:1px solid rgba(152,179,255,.28); color:#dbe5ff; font-size:13px;

  .score { color:#c8ffd7; font-weight:800; font-size:18px; margin-top:10px; }
  .summary {

    background:rgba(255,255,255,.02); line-height:1.9; font-size:16px;

  .tagbox {

  .footer { margin-top:16px; text-align:center; color:var(--muted); font-size:13px; }
  @media (max-width: 720px) {

    .seat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .winner { font-size:36px; }
    .scale-btn { padding:14px 6px; }

function nextStepAfterLikert() {
  current += 1;
  if (currentSection === "blue" && current >= blueQuestions.length) {
    currentSection = "red";
    current = 0;
  } else if (currentSection === "red" && current >= redQuestions.length) {
    currentSection = "style";
    current = 0;
  } else if (currentSection === "style" && current >= styleQuestions.length) {
    currentSection = "seat";
    current = 0;
  }
  render();
}

function meanAbsDiff(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
  return s / a.length;
}

function seatPenalty(userSeat, playerSeat) {
  if (!userSeat) return 2.0;
  if (!playerSeat) return 2.0;
  return Math.abs(userSeat - playerSeat) / 11 * 5;
}

function parseStory(raw) {
  const text = (raw || "").toString();
  return {
    story: text.includes("1"),
    author: text.includes("2")
  };
}

function storyPenalty(intent, raw) {
  const p = parseStory(raw);
  if (intent === "none") {
    return (p.story || p.author) ? 2.0 : 0.0;
  }
  if (intent === "story") {
    if (p.story && !p.author) return 0.0;
    if (p.story && p.author) return 0.8;
    if (!p.story && p.author) return 2.2;
    return 2.8;
  }
  if (intent === "author") {
    if (!p.story && p.author) return 0.0;
    if (p.story && p.author) return 0.8;
    if (p.story && !p.author) return 2.2;
    return 2.8;
  }
  if (intent === "both") {
    if (p.story && p.author) return 0.0;
    if (p.story || p.author) return 1.2;
    return 2.8;
  }
  return 1.5;
}

function similarityFromScore(score) {
  const sim = Math.round((1 - score / 5) * 100);
  return clamp(sim, 0, 100);
}

function bestMatch() {
  let best = null;
  for (const p of players) {
    const blueScore = meanAbsDiff(blueVec, p.blue);
    const redScore = meanAbsDiff(redVec, p.red);
    const styleScore = meanAbsDiff(styleVec, p.style);
    const seatScore = seatPenalty(chosenSeat, p.seat);
    const storyScore = storyPenalty(storyIntent, p.story);

    const biasScore = playerBias[p.name] || 0;
    const finalScore =
      blueScore * 0.30 +
      redScore * 0.30 +
      styleScore * 0.28 +
      seatScore * 0.08 +
      storyScore * 0.04 +
      biasScore;

    if (!best || finalScore < best.finalScore) {
      best = {
        ...p,
        blueScore, redScore, styleScore, seatScore, storyScore,
        finalScore,
        similarity: similarityFromScore(finalScore)
      };
    }
  }
  return best;
}

function rankLabel(vec, labels) {
  const pairs = labels.map((label, idx) => [label, vec[idx]]);
  pairs.sort((a, b) => b[1] - a[1]);
  return pairs.slice(0, 2).map(x => x[0]);
}

function buildSummary(player) {
  const blueTop = rankLabel(blueVec, ["蓝复原","蓝站边","蓝操作","蓝发言"]);
  const redTop = rankLabel(redVec, ["红战术","红对抗","红欺诈","红发言"]);
  const styleTop = rankLabel(styleVec, ["红蓝统一","逆风抗压","一人成军","节目效果","霸麦仙人"]);
  return `你的整体画像更接近“${blueTop[0]} + ${redTop[0]} + ${styleTop[0]}”这一类玩家。<br />` +
         `从答题结果看，你在蓝牌侧更偏向 ${blueTop.join(" / ")}，红牌侧更偏向 ${redTop.join(" / ")}，` +
         `而风格上最突出的是 ${styleTop.join(" / ")}。因此最终匹配到 <b>${player.name}</b>。`;
}

function storyText(raw) {
  const p = parseStory(raw);
  if (p.story && p.author) return "说书人 / 剧本作者双修";
  if (p.story) return "偏说书人";
  if (p.author) return "偏剧本作者";
  return "暂无明显说书 / 写本标记";
}

function render() {
  const screen = document.getElementById("screen");

  if (stage === "start") {
    screen.className = "card hero";
    screen.innerHTML = `
      <h1 class="title">你是谁？</h1>
      <div class="muted">
        测试仅供参考
      </div>
      
      <button id="startBtn" class="primary">开始测试</button>
    `;
    document.getElementById("startBtn").addEventListener("click", () => {
      stage = "quiz";
      currentSection = "blue";
      current = 0;
      render();
    });
    return;
  }

  if (stage === "result") {
    const p = bestMatch();
    const seatText = p.seat ? `${p.seat} 号位` : "未记录";
    const pickedSeat = chosenSeat ? `${chosenSeat} 号位` : "未选择";
    const pickedStory = {
      none: "暂时没兴趣",
      story: "更想尝试说书",
      author: "更想尝试做剧本",
      both: "两者都有兴趣"
    }[storyIntent];

    screen.className = "card result-card";
    screen.innerHTML = `
      <div class="badge">测试结果</div>
      <h2 class="winner">${p.name}</h2>
      <div class="score">相似度 ${p.similarity}%</div>
      <div class="summary">${buildSummary(p)}</div>
      <div class="tagbox">
        <b>角色总结：</b><br />
        ${p.tag || "这位玩家暂时没有填写个人 tag。"}
      </div>
     
      <button id="restartBtn" class="primary">再测一次</button>
    `;
    document.getElementById("restartBtn").addEventListener("click", () => {
      stage = "start";
      current = 0;
      currentSection = "blue";
      blueVec = [2.5,2.5,2.5,2.5];
      redVec = [2.5,2.5,2.5,2.5];
      styleVec = [2.5,2.5,2.5,2.5,2.5];
      chosenSeat = 0;
      storyIntent = "none";
      render();
    });
    return;
  }

  const answered = progressCount();
  const progress = Math.round(answered / 27 * 100);
  const meta = sectionMeta();
  const tagText = meta[0];
  const tagClass = meta[1];

  let title = "";
  if (currentSection === "blue") title = blueQuestions[current];
  else if (currentSection === "red") title = redQuestions[current];
  else if (currentSection === "style") title = styleQuestions[current];
  else if (currentSection === "seat") title = "你最喜欢的座位号是？";
  else title = "你是否有说书或做剧本的意愿？";

  let content = `
    <div class="progress-card">
      <div class="progress-top">
        <span>进度</span>
        <span>${answered + 1} / 27</span>
      </div>
      <div class="bar"><div style="width:${progress + 4}%"></div></div>
    </div>
    <div class="question-card">
      <div class="section-tag ${tagClass}">${tagText}</div>
      <h2 class="question-title">${title}</h2>
  `;

  if (currentSection === "seat") {
    let seatButtons = "";
    for (let i = 1; i <= 12; i++) {
      seatButtons += `<button class="seat-btn" data-seat="${i}">${i}</button>`;
    }
    content += `<div class="seat-grid">${seatButtons}</div>`;
  } else if (currentSection === "story") {
    content += `
      <div class="story-grid">
        <button class="story-btn" data-story="none">暂时没兴趣</button>
        <button class="story-btn" data-story="story">更想尝试说书</button>
        <button class="story-btn" data-story="author">更想尝试做剧本</button>
        <button class="story-btn" data-story="both">两者都有兴趣</button>
      </div>
    `;
  } else {
    let scaleButtons = "";
    for (const v of [1,2,3,4,5,6,7]) {
      scaleButtons += `<button class="scale-btn" data-value="${v}">${v}</button>`;
    }
    content += `
      <div class="likert-labels">
        <span>非常不同意</span>
        <span>非常同意</span>
      </div>
      <div class="scale-grid">${scaleButtons}</div>
    `;
  }

  content += `</div>`;
  screen.className = "card";
  screen.innerHTML = content;

  if (currentSection === "seat") {
    screen.querySelectorAll(".seat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        chosenSeat = Number(btn.dataset.seat);
        currentSection = "story";
        render();
      });
    });
  } else if (currentSection === "story") {
    screen.querySelectorAll(".story-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        storyIntent = btn.dataset.story;
        stage = "result";
        render();
      });
    });
  } else {
    screen.querySelectorAll(".scale-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        applyLikert(Number(btn.dataset.value));
        nextStepAfterLikert();
      });
    });
  }
}

render();
</script>
</body>
</html>
