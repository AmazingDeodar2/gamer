  const answered=progressCount();
  const progress=Math.round(answered/27*100);
  const options=shuffle(question.options.map((t,idx)=>({text:t,idx})));
  screen.className="card";
  screen.innerHTML=`<div class="progress-card"><div class="progress-top"><span>进度</span><span>${answered+1} / 27</span></div><div class="bar"><div style="width:${progress+4}%"></div></div></div><div class="question-card"><div class="section-tag">${sectionLabel()}</div><h2 class="question-title">${question.title}</h2><div class="option-grid">${options.map((op,i)=>`<button class="option-btn" data-i="${i}">${op.text}</button>`).join("")}</div></div>`;
  screen.querySelectorAll(".option-btn").forEach((btn,i)=>{btn.addEventListener("click",()=>{const pick=options[i];answers.push(currentSection+":"+current+":"+pick.idx);applyLikert(pick.idx);nextSection();});});
}
function renderSeat(screen){
  const answered=progressCount();
  const progress=Math.round(answered/27*100);
  let seatButtons="";
  for(let i=1;i<=12;i++)seatButtons+=`<button class="seat-btn" data-seat="${i}">${i}</button>`;
  screen.className="card";
  screen.innerHTML=`<div class="progress-card"><div class="progress-top"><span>进度</span><span>${answered+1} / 27</span></div><div class="bar"><div style="width:${progress+4}%"></div></div></div><div class="question-card"><div class="section-tag">风格题</div><h2 class="question-title">26. 你最喜欢的座位号是？</h2><div class="seat-grid">${seatButtons}</div></div>`;
  screen.querySelectorAll(".seat-btn").forEach(btn=>{btn.addEventListener("click",()=>{chosenSeat=Number(btn.dataset.seat);answers.push("seat:"+btn.dataset.seat);currentSection="story";render();});});
}
function renderStory(screen){
  const answered=progressCount();
  const progress=Math.round(answered/27*100);
  screen.className="card";
  screen.innerHTML=`<div class="progress-card"><div class="progress-top"><span>进度</span><span>${answered+1} / 27</span></div><div class="bar"><div style="width:${progress+4}%"></div></div></div><div class="question-card"><div class="section-tag">风格题</div><h2 class="question-title">27. 你是否有说书或做剧本的意愿？</h2><div class="story-grid"><button class="story-btn" data-story="none">暂时没兴趣</button><button class="story-btn" data-story="story">更想尝试说书</button><button class="story-btn" data-story="author">更想尝试做剧本</button><button class="story-btn" data-story="both">两者都有兴趣</button></div></div>`;
  screen.querySelectorAll(".story-btn").forEach(btn=>{btn.addEventListener("click",()=>{storyIntent=btn.dataset.story;answers.push("story:"+btn.dataset.story);stage="result";render();});});
}
function render(){
  const screen=document.getElementById("screen");
  if(stage==="start")return renderStart(screen);
  if(stage==="result")return renderResult(screen);
  if(currentSection==="seat")return renderSeat(screen);
  if(currentSection==="story")return renderStory(screen);
  if(currentSection==="blue")return renderScaleQuestion(screen, blueQuestions[current]);
  if(currentSection==="red")return renderScaleQuestion(screen, redQuestions[current]);
  return renderScaleQuestion(screen, styleQuestions[current]);
}
render();
</script>
