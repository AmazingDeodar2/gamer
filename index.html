<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>血染钟楼：你最像哪位社团玩家？</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #171a22;
      --line: #2a3142;
      --text: #eef2ff;
      --muted: #a6b0c8;
      --accent: #7c9cff;
      --accent-2: #98b0ff;
      --btn: #141926;
      --btn-hover: #20283a;
      --success: #b8ffcf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 156, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #0c0f15 0%, #111521 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    .card {
      background: rgba(23, 26, 34, 0.94);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .hero {
      padding: 28px 24px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.15;
    }
    .muted {
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
    }
    .start-btn, .restart-btn {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 16px;
      cursor: pointer;
      margin-top: 16px;
    }
    .progress-card {
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .bar {
      width: 100%;
      height: 12px;
      background: #0f1320;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #20283a;
    }
    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #c1d0ff);
      transition: width .25s ease;
    }
    .question-card {
      padding: 22px 20px 20px;
    }
    .question-title {
      font-size: 24px;
      line-height: 1.55;
      margin: 0 0 18px;
    }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .seat-btn, .scale-btn {
      width: 100%;
      text-align: center;
      border: 1px solid #34405a;
      background: var(--btn);
      color: var(--text);
      padding: 16px 10px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1.4;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .seat-btn:hover, .scale-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .likert-wrap {
      display: grid;
      gap: 12px;
    }
    .likert-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-top: -2px;
    }
    .scale-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }
    .result-card {
      padding: 24px 22px;
    }
    .result-badge {
      display: inline-block;
      padding: 6px 10px;
      background: rgba(124, 156, 255, 0.12);
      border: 1px solid rgba(124, 156, 255, 0.28);
      border-radius: 999px;
      color: #d7e1ff;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .winner {
      font-size: 44px;
      line-height: 1.1;
      font-weight: 800;
      margin: 0;
    }
    .sim {
      margin-top: 10px;
      color: var(--success);
      font-size: 18px;
      font-weight: 700;
    }
    .blurb {
      margin-top: 18px;
      color: var(--text);
      line-height: 1.9;
      font-size: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 16px;
    }
    .sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 720px) {
      .seat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .scale-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
      .scale-btn { padding: 14px 6px; font-size: 15px; }
    }
    @media (max-width: 640px) {
      h1 { font-size: 26px; }
      .question-title { font-size: 20px; }
      .winner { font-size: 34px; }
      .seat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

  <script>
    const players = [{"name": "红藕", "stats": [5, 5, 5, 5, 5, 4, 5, 5], "seat": "12", "blurb": "你像红藕：全局信息吃得快，蓝牌能盘，红牌也能编，属于桌上很容易成为核心视角的人。你的优势不只是会说，更在于能把局势往自己理解的方向收束。"}, {"name": "摆烂", "stats": [5, 5, 5, 5, 4, 5, 5, 5], "seat": "6", "blurb": "你像摆烂：综合能力非常均衡，思路稳定，输出稳定，关键轮也不容易掉线。你不是靠某一项特别离谱取胜，而是靠整局都很能打。"}, {"name": "刘帅", "stats": [4, 5, 5, 4, 4, 5, 5, 5], "seat": "1", "blurb": "你像刘帅：擅长在复杂局面里找节奏点，既会站边，也会做局，对抗感强，临场反应快。你的风格通常很有存在感，属于很容易把局打活的人。"}, {"name": "尘叔", "stats": [5, 5, 5, 3, 4, 5, 5, 5], "seat": "无", "blurb": "你像尘叔：蓝牌侧尤其强，信息整合和判断都在线，发言也比较有压制力。你更像是那种靠硬实力把局面一点点盘清的人。"}, {"name": "阿司匹林", "stats": [4, 5, 5, 4, 4, 5, 5, 5], "seat": "11", "blurb": "你像阿司匹林：判断力和执行力都很稳，能在信息不完整的时候快速找到可信方向。你通常不是最花的，但常常是很难被忽视的那个点。"}, {"name": "泽度", "stats": [4, 5, 5, 3, 4, 5, 5, 5], "seat": "无", "blurb": "你像泽度：更偏稳定推进型，擅长把模糊局势逐渐清晰化。你的节奏不一定最炸，但常常是越到后面越显出价值。"}, {"name": "低语", "stats": [3, 3, 4, 4, 4, 5, 5, 4], "seat": "10", "blurb": "你像低语：红牌思路和对抗欲都不弱，能顶压力，也敢在关键对话里狠狠干。你给人的感觉通常是，状态一来会非常难处理。"}, {"name": "黑星", "stats": [4, 4, 4, 2, 3, 2, 4, 4], "seat": "7", "blurb": "你像黑星：整体比较均衡，蓝牌有基本盘，发言也能跟得上。你不一定每局都抢镜，但很少成为完全没存在感的人。"}, {"name": "初秋", "stats": [3, 4, 3, 3, 3, 3, 5, 3], "seat": "6", "blurb": "你像初秋：操作感比较突出，愿意主动去做一些局部尝试。你不完全是纯逻辑流，而是更依赖临场判断和动手能力。"}, {"name": "橙子", "stats": [3, 4, 4, 2, 3, 3, 4, 3], "seat": "4", "blurb": "你像橙子：更像扎实的实战派，蓝牌侧思路不错，也有一定操作能力。你在桌上的发挥往往是稳中带点自己的节奏。"}, {"name": "少爷", "stats": [3, 3, 3, 1, 3, 4, 4, 4], "seat": "无", "blurb": "你像少爷：更偏对话和场面型，能在人与人之间的交流里找到突破口。你未必是最会还原盘面的，但会让局面变得有变化。"}, {"name": "讷之", "stats": [4, 3, 3, 3, 3, 2, 4, 3], "seat": "无", "blurb": "你像讷之：有自己的逻辑主线，也能在红蓝两边切换思维。你的风格通常不算特别炸裂，但会给人一种有想法的感觉。"}, {"name": "吃饱", "stats": [3, 4, 3, 2, 3, 3, 3, 4], "seat": "10", "blurb": "你像吃饱：发言和站边比较平衡，整体节奏感还不错。你属于那种不一定最夸张，但常常能稳稳贡献作用的玩家。"}, {"name": "四喜", "stats": [3, 4, 4, 2, 2, 2, 4, 3], "seat": "无", "blurb": "你像四喜：蓝牌基础不错，操作层面也有一定亮点。你更适合靠稳定输出取胜，而不是靠极端风格压桌。"}, {"name": "大鱼", "stats": [2, 3, 3, 2, 3, 4, 4, 3], "seat": "无", "blurb": "你像大鱼：喜欢在局部交锋里找机会，思路不算保守。你可能不是最稳的那类人，但常常能在关键节点打出有意思的东西。"}, {"name": "宇哥", "stats": [2, 2, 3, 2, 3, 3, 3, 4], "seat": "无", "blurb": "你像宇哥：更偏娱乐与灵感并存的风格，发言有自己的味道，偶尔还能整出让全桌都记住的桥段。你属于节目效果和实战发挥都可能出现的类型。"}, {"name": "雪松", "stats": [3, 3, 4, 1, 3, 1, 3, 4], "seat": "8", "blurb": "你像雪松：偏蓝牌向，信息处理和表达还不错，更适合在相对清晰的局势里不断放大自己的优势。"}, {"name": "小能", "stats": [4, 1, 3, 3, 2, 3, 3, 3], "seat": "无", "blurb": "你像小能：个人风格比较鲜明，不太是传统意义上的均衡模板。你有自己独特的判断方式，一旦对上节奏就会很有辨识度。"}, {"name": "小蔡", "stats": [3, 4, 3, 1, 3, 1, 3, 3], "seat": "4", "blurb": "你像小蔡：站边和基本盘还可以，整体属于偏稳的中段型玩家。你不是高压风格，但通常也不会轻易完全迷路。"}, {"name": "草木人", "stats": [1, 4, 1, 1, 3, 4, 4, 3], "seat": "无", "blurb": "你像草木人：更偏感觉流和局部判断流，不是那种靠完整大盘打人的类型。你的优势在于能从局部切口里打出点东西。"}, {"name": "面哥", "stats": [1, 2, 2, 1, 3, 4, 3, 4], "seat": "无", "blurb": "你像面哥：对场面互动比较敏感，发言也有存在感。你更像实战交流型选手，而不是坐下来慢慢画全局树的人。"}, {"name": "呆呆兽", "stats": [2, 4, 4, 1, 1, 1, 3, 4], "seat": "8", "blurb": "你像呆呆兽：偏蓝牌站边与辅助逻辑型，适合在队伍里承担补信息和补视角的工作。你的特点是能在正确方向上持续添砖加瓦。"}, {"name": "荣神", "stats": [3, 4, 3, 1, 1, 2, 3, 2], "seat": "5", "blurb": "你像荣神：更偏朴素稳健型，判断和基本蓝牌能力都在线。你不一定特别张扬，但通常有自己比较清晰的信念。"}, {"name": "血球", "stats": [1, 3, 3, 1, 1, 4, 3, 2], "seat": "1", "blurb": "你像血球：对抗属性比较明显，面对冲突不太会退。你的风格不一定圆润，但在需要硬碰硬的时候往往敢上。"}, {"name": "小羊", "stats": [3, 4, 2, 1, 1, 2, 2, 3], "seat": "3", "blurb": "你像小羊：更接近偏蓝牌站边型，思路相对直接，适合在比较明确的线索里快速做选择。"}, {"name": "嘤嘤嘤", "stats": [1, 3, 1, 1, 1, 1, 2, 2], "seat": "2", "blurb": "你像嘤嘤嘤：整体更轻巧、更娱乐向，不是压迫式风格。你在局里的存在方式往往不是最硬的，但可能是很有个人气质的。"}, {"name": "西格玛", "stats": [1, 0, 1, 1, 1, 1, 3, 3], "seat": "3", "blurb": "你像西格玛：非常偏直觉和节目效果流，不太按标准模板出牌。你未必最像教科书玩家，但很可能是最有自己味道的那类人。"}];
    const playerBias = {
      "红藕": -1.2976,
      "摆烂": -1.2821,
      "刘帅": -0.9076,
      "尘叔": -0.3722,
      "阿司匹林": -1.0836,
      "泽度": -0.2499,
      "低语": 0.0,
      "黑星": -0.369,
      "初秋": -0.4424,
      "橙子": -0.3084,
      "少爷": 0.2446,
      "讷之": 0.7022,
      "吃饱": -0.1195,
      "四喜": 1.0667,
      "大鱼": 0.99,
      "宇哥": 1.2451,
      "雪松": -0.316,
      "小能": 1.2277,
      "小蔡": -0.4027,
      "草木人": 0.8165,
      "面哥": 1.2804,
      "呆呆兽": -0.1002,
      "荣神": 0.0,
      "血球": -0.6039,
      "小羊": -0.0586,
      "嘤嘤嘤": 0.0,
      "西格玛": 0.0
};
    const questions = [{"type": "seat", "title": "1. 你最喜欢的座位号是？", "minLabel": "1号位", "maxLabel": "12号位"}, {"type": "likert", "title": "2. 我会更依赖直觉而不是完整的信息链条。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [-0.6, -0.3, -0.4, 0.8, 0.5, 0.8, 0.6, 0.2]}, {"type": "likert", "title": "3. 在信息还不完整时，我也愿意通过冒险发言或投票来推动局势。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [-0.3, 0.2, 0.0, 0.6, 0.8, 1.0, 0.8, 0.6]}, {"type": "likert", "title": "4. 在对局中，我更倾向于表达真实想法，很少刻意表演或伪装。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.6, 0.3, 0.5, -0.9, -0.6, -0.7, -0.1, 0.4]}, {"type": "likert", "title": "5. 在邪恶阵营中，我通常承担布置战术和排兵布阵。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.0, 0.0, 0.1, 0.6, 1.1, 0.8, 0.5, 0.4]}, {"type": "likert", "title": "6. 只要能赢，我不怕成为“焦点”。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.0, 0.1, 0.0, 0.5, 0.7, 0.9, 0.4, 1.0]}, {"type": "likert", "title": "7. 我会有意识地引导他人去怀疑某些玩家。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.1, 0.2, 0.0, 0.8, 0.9, 1.0, 0.4, 0.8]}, {"type": "likert", "title": "8. 如果言之有理，其他人应该跟随我。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.2, 0.4, 0.2, 0.3, 0.8, 0.5, 0.1, 0.9]}, {"type": "likert", "title": "9. 如果后来出现更可靠的新信息，我会修正自己之前的站边和投票。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.7, 0.9, 0.6, -0.2, -0.1, -0.2, 0.0, 0.1]}, {"type": "likert", "title": "10. 在局势不明朗时，我愿意先公开部分关键信息来换取场上反馈。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.6, 0.5, 0.5, 0.1, 0.3, 0.4, 0.1, 0.8]}, {"type": "likert", "title": "11. 一旦我对某个玩家形成身份判断，我通常不会轻易改变。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [-0.4, 0.3, -0.1, 0.3, 0.4, 0.5, 0.1, 0.1]}, {"type": "likert", "title": "12. 即使不是信息位，我通常也会主动发言。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.1, 0.2, 0.0, 0.3, 0.4, 0.4, 0.2, 1.1]}, {"type": "likert", "title": "13. 比起其他玩家的状态，我更关注他们提供的信息。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.9, 0.5, 0.7, -0.3, -0.2, -0.1, 0.0, 0.1]}, {"type": "likert", "title": "14. 我会主动整理发言情况、信息来源，并寻找其中的矛盾点。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [1.1, 0.6, 1.0, 0.1, 0.1, 0.5, 0.1, 0.5]}, {"type": "likert", "title": "15. 如果没有较明确的证据，我通常不会轻易投票。", "weights": [-1.4, -0.9, -0.4, 0, 0.4, 0.9, 1.4], "delta": [0.6, 0.7, 0.5, -0.2, -0.3, -0.3, -0.1, -0.2]}];

    let current = 0;
    let vector = new Array(8).fill(0);
    let chosenSeat = null;

    function clamp(x, a, b) {
      return Math.max(a, Math.min(b, x));
    }

    function normalize(vec) {
      return vec.map(v => clamp(Math.round(2.5 + v), 0, 5));
    }

    function distance(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) {
        sum += (a[i] - b[i]) * (a[i] - b[i]);
      }
      return Math.sqrt(sum);
    }

    function seatPenalty(userSeat, playerSeat) {
      if (!userSeat || playerSeat === "无") return 0;
      const d = Math.abs(Number(userSeat) - Number(playerSeat));
      return d * 0.60;
    }

    function similarityFromDistance(d) {
      const maxPossible = 10;
      const sim = Math.round((1 - d / maxPossible) * 100);
      return clamp(sim, 0, 100);
    }

    function bestMatch(answerVec) {
      const normalized = normalize(answerVec);
      let best = null;
      for (const p of players) {
        const base = distance(normalized, p.stats);
        const balanceOffset = playerBias[p.name] || 0;
        const finalDistance = base + seatPenalty(chosenSeat, p.seat) + balanceOffset;
        const sim = similarityFromDistance(finalDistance);
        if (!best || finalDistance < best.distance) {
          best = {
            name: p.name,
            seat: p.seat,
            blurb: p.blurb,
            distance: finalDistance,
            similarity: sim
          };
        }
      }
      return best;
    }

    function renderQuestion() {
      const q = questions[current];
      const percent = Math.round((current / questions.length) * 100);
      const screen = document.getElementById("screen");
      screen.className = "card";
      let content = `
        <div class="progress-card">
          <div class="progress-top">
            <span>进度</span>
            <span>${current + 1} / ${questions.length}</span>
          </div>
          <div class="bar"><div style="width:${percent + Math.round(100 / questions.length)}%"></div></div>
        </div>
        <div class="question-card">
          <h2 class="question-title">${q.title}</h2>
      `;

      if (q.type === "seat") {
        content += `
          <div class="seat-grid">
            ${Array.from({ length: 12 }, (_, i) => `
              <button class="seat-btn" data-seat="${i + 1}">${i + 1}</button>
            `).join("")}
          </div>
        `;
      } else {
        content += `
          <div class="likert-wrap">
            <div class="likert-labels">
              <span>非常不同意</span>
              <span>非常同意</span>
            </div>
            <div class="scale-grid">
              ${[1,2,3,4,5,6,7].map(v => `
                <button class="scale-btn" data-value="${v}">${v}</button>
              `).join("")}
            </div>
          </div>
        `;
      }

      content += `</div>`;
      screen.innerHTML = content;

      if (q.type === "seat") {
        screen.querySelectorAll(".seat-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            chosenSeat = Number(btn.dataset.seat);
            current += 1;
            renderQuestion();
          });
        });
      } else {
        screen.querySelectorAll(".scale-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const v = Number(btn.dataset.value);
            const w = q.weights[v - 1];
            vector = vector.map((oldVal, i) => oldVal + q.delta[i] * w);
            current += 1;
            if (current >= questions.length) {
              renderResult();
            } else {
              renderQuestion();
            }
          });
        });
      }
    }

    function renderResult() {
      const result = bestMatch(vector);
      const screen = document.getElementById("screen");
      screen.className = "card result-card";
      screen.innerHTML = `
        <div class="result-badge">测试结果</div>
        <h2 class="winner">${result.name}</h2>
        <div class="sim">相似度 ${result.similarity}%</div>
        <div class="blurb">${result.blurb}</div>
        <div class="sub">
          这个测试是娱乐向匹配，当前版本已重新校准题目权重，并提高了座位号题目的影响；同时加入了分布均衡补偿，目标是让随机作答时单个结果不会过度集中。结果更偏向你在答题中表现出的直觉/逻辑倾向、发言风格、站边方式、对抗欲与座位偏好，
          不代表真实水平高低。
        </div>
        <button class="restart-btn" id="restartBtn">再测一次</button>
      `;
      document.getElementById("restartBtn").addEventListener("click", () => {
        current = 0;
        chosenSeat = null;
        vector = new Array(8).fill(0);
        renderStart();
      });
    }

    function renderStart() {
      const screen = document.getElementById("screen");
      screen.className = "card hero";
      screen.innerHTML = `
        <h1>血染钟楼：你最像哪位社团玩家？</h1>
        <div class="muted">
          
        </div>
        <button class="start-btn" id="startBtn">开始测试</button>
      `;
      document.getElementById("startBtn").addEventListener("click", renderQuestion);
    }

    document.getElementById("startBtn").addEventListener("click", renderQuestion);
  </script>
</body>
</html>
